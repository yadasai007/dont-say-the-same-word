<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Say the Same Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  /* Layout: one narrow column of "cue cards", like a game-show host's stack, passed around a single device. */
  :root {
    --bg: #e9edf5; --card: #ffffff; --ink: #141826; --muted: #5d6479;
    --accent: #3445c9; --accent-ink: #ffffff; --chip: #eef1f8; --line: #d9deea;
    --marker: #ffd23f; --marker-ink: #141826;
    --same: #c8323c; --safe: #23875a;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131d; --card: #1a1f2d; --ink: #eef0f7; --muted: #9aa1b6;
      --accent: #7f8cff; --accent-ink: #10131d; --chip: #242a3b; --line: #2d3446;
      --marker: #ffd23f; --marker-ink: #141826;
      --same: #ff6b72; --safe: #4fd08f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131d; --card: #1a1f2d; --ink: #eef0f7; --muted: #9aa1b6;
    --accent: #7f8cff; --accent-ink: #10131d; --chip: #242a3b; --line: #2d3446;
    --marker: #ffd23f; --marker-ink: #141826;
    --same: #ff6b72; --safe: #4fd08f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
    padding-inline: 16px; padding-block: 28px 48px;
  }
  .app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .wordmark {
    font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.05;
    letter-spacing: -0.03em; margin: 0; text-wrap: balance;
  }
  .wordmark s { text-decoration-color: var(--same); text-decoration-thickness: 4px; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .eyebrow {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  label { font-weight: 600; font-size: 0.95rem; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  input[type=text], input[type=password] {
    width: 100%; min-width: 0; padding: 12px 14px; font: inherit; border-radius: 10px;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border: none; border-radius: 10px;
    padding: 12px 18px; background: var(--accent); color: var(--accent-ink);
  }
  button.secondary { background: var(--chip); color: var(--ink); }
  button.same { background: var(--same); color: #fff; }
  button.safe { background: var(--safe); color: #fff; }
  button.link { background: none; color: var(--muted); padding: 4px 6px; font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .row > .grow { flex: 1; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { background: var(--chip); color: var(--ink); display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; }
  .seg button small { font-weight: 500; color: var(--muted); font-size: 0.8rem; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .seg button.on small { color: inherit; opacity: 0.8; }
  .players { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .players li {
    display: flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px;
    border-radius: 999px; background: var(--chip); font-weight: 600;
  }
  .hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
  .err { color: var(--same); font-size: 0.9rem; margin: 0; min-height: 1.2em; }
  .big {
    font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1.1;
    text-align: center; margin: 0; word-break: break-word; text-wrap: balance;
  }
  .marker {
    background: var(--marker); color: var(--marker-ink); padding: 0 0.25em; border-radius: 4px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  .center { text-align: center; align-items: center; }
  .pill {
    align-self: center; display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 0.82rem; font-weight: 700; color: var(--muted);
  }
  .timer { font-family: var(--mono); font-size: 3.2rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
  .timer.low { color: var(--same); }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width 0.25s linear; }
  .score-table { width: 100%; border-collapse: collapse; }
  .score-table td { padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table td:last-child { text-align: right; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .out { color: var(--muted); text-decoration: line-through; }
  .delta { color: var(--same); margin-left: 6px; font-size: 0.85rem; }
  .tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }
  .reveal-item {
    padding: 14px; border-radius: 12px; background: var(--chip);
    display: flex; flex-direction: column; gap: 6px; border-left: 5px solid var(--line);
  }
  .reveal-item.is-same { border-left-color: var(--same); }
  .reveal-item.is-diff { border-left-color: var(--safe); }
  .reveal-item .who { font-weight: 700; color: var(--muted); font-size: 0.9rem; }
  .reveal-item .ans { font-family: var(--display); font-size: 1.5rem; font-weight: 800; word-break: break-word; line-height: 1.15; }
  .verdict { font-weight: 700; }
  .verdict.same { color: var(--same); }
  .verdict.diff { color: var(--safe); }
  .quip { font-style: italic; color: var(--muted); margin: 0; }
  .match-hint { font-size: 0.85rem; color: var(--same); font-weight: 700; margin: 0; }
  .host {
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
  }
  .host .eyebrow, .host .sub { color: inherit; opacity: 0.8; }
  .host .speech { font-family: var(--display); font-weight: 600; font-size: 1.45rem; line-height: 1.25; margin: 0; text-wrap: balance; }
  .rules { margin: 0; padding-left: 1.1em; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>window.POOL_DATA = [];</script>
<script src="questions-1.js"></script>
<script src="questions-2.js"></script>
<script src="questions-3.js"></script>
<script src="questions-4.js"></script>
<script src="questions-5.js"></script>
<script>
const MAX_PLAYERS = 8;
const TURN_SECONDS = 60;
const MIN_PLAYERS = { human: 3, computer: 1 };
const STORE_KEY = 'dssw-learned-v1';

const state = {
  screen: 'setup',
  mode: 'human',        // 'human' | 'computer'
  startScore: 5,
  players: [],          // { name, score }
  hostIndex: 0,         // human mode only
  round: 0,
  category: '',         // the question / category everyone sees
  word: '',             // the host's secret word
  wordGroup: [],        // computer mode: the secret word plus words that count as the same
  usedKeys: [],         // computer mode: questions already asked this game
  queue: [],
  current: null,
  answers: {},          // playerIndex -> text
  decisions: {},        // playerIndex -> 'same' | 'diff'
  lastDeltas: {},
  lastLearned: '',
  confirmReset: false,
};

// ---------- question pool ----------
// Each entry: { q, groups: [[word, alias, ...], ...] }. Words in one group count as the same answer.
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
const POOL = new Map();
let learned = {};       // key -> { q, groups } added from games on this device
let builtInQuestions = 0, builtInWords = 0;

function mergeGroup(entry, words) {
  const add = words.map(w => String(w).trim()).filter(Boolean);
  if (!add.length) return;
  const keys = new Set(add.map(norm));
  const hits = entry.groups.filter(g => g.some(w => keys.has(norm(w))));
  const merged = [];
  for (const w of [...hits.flat(), ...add]) if (!merged.some(m => norm(m) === norm(w))) merged.push(w);
  entry.groups = entry.groups.filter(g => !hits.includes(g));
  entry.groups.push(merged);
}

function addToPool(q, groups) {
  const key = norm(q);
  let e = POOL.get(key);
  if (!e) { e = { q: q.trim(), groups: [] }; POOL.set(key, e); }
  groups.forEach(g => mergeGroup(e, g));
  return e;
}

function loadPool() {
  for (const chunk of window.POOL_DATA) {
    for (const line of chunk.split('\n')) {
      const [q, a] = line.split('|');
      if (!q || !a || !q.trim()) continue;
      addToPool(q, a.split(';').map(g => g.split('=')));
    }
  }
  builtInQuestions = POOL.size;
  builtInWords = countWords();
  try { learned = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { learned = {}; }
  for (const k in learned) addToPool(learned[k].q, learned[k].groups);
}

function countWords() {
  let n = 0;
  for (const e of POOL.values()) for (const g of e.groups) n += g.length;
  return n;
}

function saveLearned() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(learned)); } catch { /* storage unavailable: pool lasts for this visit only */ }
}

// Add this round's question and answers to the pool. Answers judged "same" join the secret word's group.
function learnFromRound() {
  const same = [state.word], others = [];
  for (const k of Object.keys(state.answers)) {
    const a = state.answers[k].trim();
    if (!a) continue;
    if (state.decisions[k] === 'same') same.push(a); else others.push([a]);
  }
  const groups = [same, ...others];
  const before = countWords(), hadQuestion = POOL.has(norm(state.category));
  addToPool(state.category, groups);
  const key = norm(state.category);
  if (!learned[key]) learned[key] = { q: state.category, groups: [] };
  groups.forEach(g => mergeGroup(learned[key], g));
  saveLearned();
  const added = countWords() - before;
  state.lastLearned = !hadQuestion
    ? `New question added to the pool with ${added} answer${added === 1 ? '' : 's'}.`
    : added ? `${added} new answer${added === 1 ? '' : 's'} added to the pool.` : '';
}

function forgetLearned() {
  learned = {};
  saveLearned();
  POOL.clear();
  loadPool();
  state.confirmReset = false;
  render();
}

function pickComputerQuestion() {
  let keys = [...POOL.keys()].filter(k => POOL.get(k).groups.length >= 2 && !state.usedKeys.includes(k));
  if (!keys.length) { state.usedKeys = []; keys = [...POOL.keys()].filter(k => POOL.get(k).groups.length >= 2); }
  if (!keys.length) return false;
  const key = keys[Math.floor(Math.random() * keys.length)];
  const e = POOL.get(key);
  const group = e.groups[Math.floor(Math.random() * e.groups.length)];
  state.usedKeys.push(key);
  state.category = e.q;
  state.word = group[0];
  state.wordGroup = group.slice();
  return true;
}

// ---------- helpers ----------
let timerId = null;
const app = document.getElementById('app');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const active = () => state.players.map((p, i) => i).filter(i => state.players[i].score > 0);
const isCPU = () => state.mode === 'computer';
const fmt = n => n.toLocaleString();

function go(screen) {
  clearInterval(timerId);
  state.screen = screen;
  render();
}

function render() {
  app.innerHTML = screens[state.screen]();
  const focus = app.querySelector('[autofocus]');
  if (focus) focus.focus();
  if (screens[state.screen + 'Init']) screens[state.screen + 'Init']();
}

// ---------- screens ----------
const screens = {
  setup() {
    const list = state.players.map((p, i) => `
      <li>${esc(p.name)}<button class="link" onclick="removePlayer(${i})" aria-label="Remove ${esc(p.name)}">✕</button></li>
    `).join('');
    const full = state.players.length >= MAX_PLAYERS;
    const min = MIN_PLAYERS[state.mode];
    const newQs = POOL.size - builtInQuestions;
    const newWords = countWords() - builtInWords;
    const hasLearned = Object.keys(learned).length > 0;
    return `
      <h1 class="wordmark">Don't Say the <s>Same</s> Word</h1>
      <p class="sub">The host picks a category and a secret word. Everyone else tries <b>not</b> to say it.</p>

      <div class="card">
        <div class="field">
          <label>Who hosts?</label>
          <div class="seg">
            <button class="${state.mode === 'human' ? 'on' : ''}" onclick="setMode('human')">Human host<small>Host rotates each round</small></button>
            <button class="${state.mode === 'computer' ? 'on' : ''}" onclick="setMode('computer')">Computer host<small>Everyone plays</small></button>
          </div>
        </div>

        <div class="field">
          <label>Starting score</label>
          <div class="seg">
            <button class="${state.startScore === 5 ? 'on' : ''}" onclick="setStart(5)">5 points</button>
            <button class="${state.startScore === 10 ? 'on' : ''}" onclick="setStart(10)">10 points</button>
          </div>
        </div>

        <div class="field">
          <label for="pname">Players · ${state.players.length}/${MAX_PLAYERS}</label>
          <div class="row">
            <input id="pname" type="text" maxlength="20" placeholder="${full ? 'Max players reached' : 'Player name'}"
                   ${full ? 'disabled' : 'autofocus'} onkeydown="if(event.key==='Enter')addPlayer()">
            <button onclick="addPlayer()" ${full ? 'disabled' : ''}>Add</button>
          </div>
          <p class="err" id="err"></p>
          ${list ? `<ul class="players">${list}</ul>` : ''}
          <p class="hint">${isCPU() ? `1–${MAX_PLAYERS} players.` : `${min}–${MAX_PLAYERS} players, host included.`}</p>
        </div>

        <button onclick="startGame()" ${state.players.length < min ? 'disabled' : ''}>Start game</button>
      </div>

      <div class="card">
        <h2>Question pool</h2>
        <p class="sub"><b>${fmt(POOL.size)}</b> questions · <b>${fmt(countWords())}</b> answers</p>
        <p class="hint">${fmt(builtInQuestions)} built in${newQs || newWords ? `, plus ${fmt(newQs)} new question${newQs === 1 ? '' : 's'} and ${fmt(newWords)} new answer${newWords === 1 ? '' : 's'} learned from your games` : ''}. Every round's question and answers are added to the pool on this device.</p>
        ${hasLearned ? (state.confirmReset
          ? `<div class="row"><span class="hint grow">Remove everything learned from your games?</span>
               <button class="same" onclick="forgetLearned()">Remove</button>
               <button class="secondary" onclick="state.confirmReset=false;render()">Keep</button></div>`
          : `<button class="link" style="align-self:flex-start" onclick="state.confirmReset=true;render()">Forget learned questions and answers</button>`) : ''}
      </div>

      <div class="card">
        <h2>How it works</h2>
        <ul class="rules">
          <li>Everyone starts with the chosen score.</li>
          <li>The host (a player or the computer) secretly picks a category and a word.</li>
          <li>Each player gets ${TURN_SECONDS} seconds to secretly type a word from that category.</li>
          <li>On reveal, answers are judged. Same word, or same meaning (purple / violet), costs <b>1 point</b>.</li>
          <li>A blank answer also costs 1 point.</li>
          <li>Hit 0 and you're out. The highest score wins.</li>
        </ul>
      </div>
    `;
  },

  // ----- human host -----
  hostHandoff() {
    const host = state.players[state.hostIndex];
    return `
      <span class="pill">Round ${state.round}</span>
      <div class="card center">
        <span class="eyebrow">Pass the device to the host</span>
        <p class="big">${esc(host.name)}</p>
        <p class="hint">Everyone else, look away.</p>
        <button onclick="go('hostInput')">I'm ${esc(host.name)}, continue</button>
      </div>
      ${scoreCard()}
    `;
  },

  hostInput() {
    const host = state.players[state.hostIndex];
    return `
      <span class="pill">Round ${state.round} · Host: ${esc(host.name)}</span>
      <div class="card">
        <h2>Pick a category and a secret word</h2>
        <div class="field">
          <label for="cat">Category or question (everyone sees this)</label>
          <input id="cat" type="text" maxlength="60" placeholder="Name a color" autofocus>
        </div>
        <div class="field">
          <label for="word">Your secret word</label>
          <div class="row">
            <input id="word" type="password" maxlength="40" placeholder="Purple"
                   onkeydown="if(event.key==='Enter')lockHost()">
            <button class="secondary" onclick="toggleVis('word', this)">Show</button>
          </div>
        </div>
        <p class="err" id="err"></p>
        <button onclick="lockHost()">Lock it in</button>
      </div>
    `;
  },

  // ----- computer host -----
  cpuQuestion() {
    return `
      <span class="pill">Round ${state.round} · Computer host</span>
      <div class="card host">
        <span class="eyebrow">The computer asks</span>
        <p class="speech">${esc(state.category)}</p>
        <p class="sub">It has secretly picked one answer at random. Don't say it.</p>
      </div>
      <button onclick="beginAnswers()">Start answering</button>
      <button class="secondary" onclick="newComputerQuestion()">Ask a different question</button>
      ${scoreCard()}
    `;
  },

  // ----- players -----
  playerHandoff() {
    const p = state.players[state.current];
    const left = state.queue.length + 1;
    return `
      <span class="pill">${esc(state.category)}</span>
      <div class="card center">
        <span class="eyebrow">Pass the device to</span>
        <p class="big">${esc(p.name)}</p>
        <p class="hint">You get ${TURN_SECONDS} seconds after you tap start. ${left} player${left > 1 ? 's' : ''} left to answer.</p>
        <button onclick="go('playerTurn')">I'm ${esc(p.name)}, start my timer</button>
      </div>
    `;
  },

  playerTurn() {
    const p = state.players[state.current];
    return `
      <span class="pill">${esc(p.name)}'s turn</span>
      <div class="card">
        <span class="eyebrow" style="text-align:center">Category</span>
        <p class="big">${esc(state.category)}</p>
        <div class="timer" id="timer">${TURN_SECONDS}</div>
        <div class="bar"><div id="bar" style="width:100%"></div></div>
        <div class="field">
          <label for="ans">Your word (don't match the host)</label>
          <div class="row">
            <input id="ans" type="password" maxlength="40" autofocus
                   onkeydown="if(event.key==='Enter')submitAnswer()">
            <button class="secondary" onclick="toggleVis('ans', this)">Show</button>
          </div>
        </div>
        <button onclick="submitAnswer()">Submit</button>
      </div>
    `;
  },
  playerTurnInit() {
    const end = Date.now() + TURN_SECONDS * 1000;
    timerId = setInterval(() => {
      const remaining = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      const t = document.getElementById('timer');
      const b = document.getElementById('bar');
      if (!t) return clearInterval(timerId);
      t.textContent = remaining;
      t.classList.toggle('low', remaining <= 10);
      b.style.width = (remaining / TURN_SECONDS * 100) + '%';
      if (remaining <= 0) submitAnswer();
    }, 250);
  },

  revealHandoff() {
    const who = isCPU() ? 'The computer checks' : `${esc(state.players[state.hostIndex].name)} (host) judges`;
    return `
      <div class="card center">
        <h2>Everyone has answered</h2>
        <p class="sub">Gather round. ${who} the answers.</p>
        <button onclick="revealWords()">Reveal the words</button>
      </div>
    `;
  },

  // ----- reveal & judge -----
  reveal() {
    const order = Object.keys(state.answers).map(Number);
    const items = order.map(i => {
      const p = state.players[i];
      const a = state.answers[i];
      const d = state.decisions[i];
      const blank = a.trim() === '';
      const exact = !blank && norm(a) === norm(state.word);
      let body;
      if (blank) {
        body = `<span class="verdict same">No answer, −1 point</span>`;
      } else if (d) {
        body = `
          <div class="row">
            <span class="verdict ${d} grow">${d === 'same' ? 'Same word, −1 point' : 'Different, safe'}</span>
            <button class="link" onclick="decide(${i}, null)">Change</button>
          </div>`;
      } else {
        body = `
          ${exact ? `<p class="match-hint">Exact match with the host's word</p>` : ''}
          <div class="row">
            <button class="same grow" onclick="decide(${i}, 'same')">Same (−1)</button>
            <button class="safe grow" onclick="decide(${i}, 'diff')">Different</button>
          </div>`;
      }
      const cls = blank || d === 'same' ? 'is-same' : d === 'diff' ? 'is-diff' : '';
      return `
        <div class="reveal-item ${cls}">
          <span class="who">${esc(p.name)}</span>
          <span class="ans">${blank ? '<span style="color:var(--muted)">(blank)</span>' : esc(a)}</span>
          ${body}
        </div>`;
    }).join('');

    const pending = order.filter(i => state.answers[i].trim() !== '' && !state.decisions[i]).length;
    const hostName = isCPU() ? 'The computer' : esc(state.players[state.hostIndex].name);
    let extra = '';
    if (isCPU()) {
      const aliases = state.wordGroup.slice(1);
      const e = POOL.get(norm(state.category));
      const others = e ? e.groups.filter(g => norm(g[0]) !== norm(state.word)).map(g => g[0]) : [];
      extra = `
        ${aliases.length ? `<p class="hint">Also counts as the same: ${aliases.map(esc).join(', ')}</p>` : ''}
        ${others.length ? `<p class="hint">It could also have picked: ${others.slice(0, 10).map(esc).join(', ')}${others.length > 10 ? '…' : ''}</p>` : ''}`;
    }
    const judgeHint = isCPU()
      ? "The computer only knows the words in its list. If an answer means the same thing, tap Change and mark it Same. It will remember next time."
      : 'Host: mark answers that mean the same thing (purple / violet) as Same.';
    return `
      <span class="pill">${esc(state.category)}</span>
      <div class="card center">
        <span class="eyebrow">${hostName}'s word was</span>
        <p class="big"><span class="marker">${esc(state.word)}</span></p>
        ${extra}
        <p class="hint">${judgeHint}</p>
      </div>
      <div class="card">
        ${items}
        <button onclick="finishRound()" ${pending ? 'disabled' : ''}>
          ${pending ? `Judge ${pending} more answer${pending > 1 ? 's' : ''}` : 'Apply scores'}
        </button>
      </div>
    `;
  },

  scores() {
    return `
      <span class="pill">After round ${state.round}</span>
      ${state.lastLearned ? `<p class="hint" style="text-align:center">${esc(state.lastLearned)}</p>` : ''}
      ${scoreCard(true)}
      <button onclick="nextRound()">Next round</button>
      <button class="secondary" onclick="go('gameOver')">End game</button>
    `;
  },

  gameOver() {
    const best = Math.max(...state.players.map(p => p.score));
    const winners = state.players.filter(p => p.score === best);
    return `
      <div class="card center">
        <span class="eyebrow">${best === 0 ? 'Game over' : winners.length > 1 ? 'Winners' : 'Winner'}</span>
        <p class="big">${best === 0 ? 'The computer wins this one' : winners.map(w => esc(w.name)).join(' & ')}</p>
        <p class="hint">${best} point${best === 1 ? '' : 's'} left after ${state.round} round${state.round === 1 ? '' : 's'}</p>
      </div>
      ${scoreCard()}
      <button onclick="startGame()">Play again with the same players</button>
      <button class="secondary" onclick="newGame()">New game</button>
    `;
  },
};

function scoreCard(showDelta) {
  const rows = state.players
    .map((p, i) => ({ p, i }))
    .sort((a, b) => b.p.score - a.p.score)
    .map(({ p, i }) => {
      const d = showDelta ? state.lastDeltas[i] : 0;
      const host = !isCPU() && i === state.hostIndex && state.screen !== 'gameOver' ? '<span class="tag">host</span>' : '';
      return `<tr>
        <td class="${p.score <= 0 ? 'out' : ''}">${esc(p.name)}${host}</td>
        <td>${p.score}${d ? `<span class="delta">${d}</span>` : ''}</td>
      </tr>`;
    }).join('');
  return `<div class="card"><h2>Scores</h2><table class="score-table">${rows}</table></div>`;
}

// ---------- actions ----------
function setErr(msg) { const e = document.getElementById('err'); if (e) e.textContent = msg; }
function setStart(n) { state.startScore = n; render(); }
function setMode(m) { state.mode = m; render(); }

function addPlayer() {
  const input = document.getElementById('pname');
  const name = input.value.trim();
  if (!name) return setErr('Enter a name.');
  if (state.players.length >= MAX_PLAYERS) return setErr(`Max ${MAX_PLAYERS} players.`);
  if (state.players.some(p => norm(p.name) === norm(name))) return setErr('That name is already taken.');
  state.players.push({ name, score: state.startScore });
  render();
}

function removePlayer(i) { state.players.splice(i, 1); render(); }

function toggleVis(id, btn) {
  const el = document.getElementById(id);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
  el.focus();
}

function startGame() {
  state.players.forEach(p => p.score = state.startScore);
  state.round = 1;
  state.hostIndex = 0;
  state.lastDeltas = {};
  state.usedKeys = [];
  startRound();
}

function startRound() {
  state.answers = {}; state.decisions = {}; state.lastLearned = '';
  if (isCPU()) { if (!pickComputerQuestion()) return go('setup'); go('cpuQuestion'); } else go('hostHandoff');
}

function newComputerQuestion() { pickComputerQuestion(); render(); }

function lockHost() {
  const cat = document.getElementById('cat').value.trim();
  const word = document.getElementById('word').value.trim();
  if (!cat) return setErr('Enter a category.');
  if (!word) return setErr('Enter your secret word.');
  state.category = cat;
  state.word = word;
  state.wordGroup = [word];
  beginAnswers();
}

function beginAnswers() {
  state.answers = {}; state.decisions = {};
  state.queue = active().filter(i => isCPU() || i !== state.hostIndex);
  state.current = state.queue.shift();
  go('playerHandoff');
}

function submitAnswer() {
  if (state.screen !== 'playerTurn') return;
  const el = document.getElementById('ans');
  state.answers[state.current] = el ? el.value : '';
  if (state.queue.length) {
    state.current = state.queue.shift();
    go('playerHandoff');
  } else {
    state.current = null;
    go('revealHandoff');
  }
}

function revealWords() {
  if (isCPU()) {
    const same = new Set(state.wordGroup.map(norm));
    for (const k of Object.keys(state.answers)) {
      const a = state.answers[k].trim();
      if (a) state.decisions[k] = same.has(norm(a)) ? 'same' : 'diff';
    }
  }
  go('reveal');
}

function decide(i, verdict) {
  if (verdict) state.decisions[i] = verdict; else delete state.decisions[i];
  render();
}

function finishRound() {
  learnFromRound();
  state.lastDeltas = {};
  for (const k of Object.keys(state.answers)) {
    const i = Number(k);
    if (state.answers[i].trim() === '' || state.decisions[i] === 'same') {
      state.players[i].score = Math.max(0, state.players[i].score - 1);
      state.lastDeltas[i] = -1;
    }
  }
  // Human host needs 2 players left (host + 1). Computer host: game ends at 1 left, or 0 when playing solo.
  const needed = isCPU() ? Math.min(2, state.players.length) : 2;
  go(active().length < needed ? 'gameOver' : 'scores');
}

function nextRound() {
  state.round++;
  if (!isCPU()) {
    const alive = active();
    for (let step = 1; step <= state.players.length; step++) {
      const cand = (state.hostIndex + step) % state.players.length;
      if (alive.includes(cand)) { state.hostIndex = cand; break; }
    }
  }
  startRound();
}

function newGame() {
  state.players = [];
  state.round = 0;
  go('setup');
}

loadPool();
render();
</script>
